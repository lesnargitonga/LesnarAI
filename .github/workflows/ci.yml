name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linting tools
        run: pip install flake8 pylint
      - name: flake8
        run: |
          flake8 backend/ scripts/ training/ shared/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501 \
            --exclude=__pycache__,migrations,*.pyc

  lint-frontend:
    name: Frontend lint & build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
      - name: Build
        working-directory: frontend
        run: npm run build

  backend-smoke:
    name: Backend import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        # The pinned requirements, so the check imports what the container runs
        # (the hand-written list here had drifted: no Flask-Limiter).
        run: |
          pip install -r backend/requirements.txt \
            flask-migrate python-dotenv gevent gevent-websocket
      - name: Generate throwaway secrets
        # app.py refuses to start with missing or placeholder secrets while auth is on.
        # Fresh random values per run; nothing is stored or reused.
        run: |
          for k in FLASK_SECRET_KEY LESNAR_ADMIN_API_KEY LESNAR_OPERATOR_API_KEY LESNAR_AUDIT_CHAIN_KEY; do
            v=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_ENV"
          done
      - name: Check backend imports
        # Imported the way backend/Dockerfile runs it: PYTHONPATH=backend:drone_simulation,
        # since app.py imports db and simulator as top-level modules.
        run: python3 -c "import app; print('backend app OK')"
        env:
          PYTHONPATH: backend:drone_simulation
          FLASK_ENV: testing
          LESNAR_EXTERNAL_ONLY: '1'
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret
